opentelemetry-collector:
  enabled: true
  mode: deployment
  replicaCount: 1

jaeger:
  enabled: true

prometheus:
  enabled: true

grafana:
  enabled: true

opensearch:
  enabled: false

components:
  flagd:
    # The flagd UI's Erlang VM used approximately 784Mi during startup on
    # the local arm64 cluster. Keep the upstream sidecar configuration and
    # give that container enough startup headroom without changing AWS.
    sidecarContainers:
      - name: flagd-ui
        useDefault:
          env: true
        service:
          port: 4000
        env:
          - name: FLAGD_METRICS_EXPORTER
            value: otel
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://$(OTEL_COLLECTOR_NAME):4318
          - name: FLAGD_UI_PORT
            value: "4000"
          - name: SECRET_KEY_BASE
            value: yYrECL4qbNwleYInGJYvVnSkwJuSQJ4ijPTx5tirGUXrbznFIBFVJdPl5t6O9ASw
          - name: PHX_HOST
            value: localhost
        resources:
          limits:
            memory: 1Gi
        volumeMounts:
          - name: config-rw
            mountPath: /app/data
