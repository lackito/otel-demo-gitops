apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: otel-demo
  namespace: opentelemetry-demo

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: otel-demo
      sectionName: http

  hostnames:
    - otel-demo.localhost

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - group: ""
          kind: Service
          name: frontend-proxy
          port: 8080
          weight: 1
